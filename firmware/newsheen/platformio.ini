; Motoko-S3 — 802.11 radio-pipe + capture for the Newsheen puck (ESP32-S3 N16R2)
[platformio]
default_envs = newsheen-motoko

[env]
platform = espressif32@6.11.0
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 1000000
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  -D CORE_DEBUG_LEVEL=0
  ; let our ieee80211_raw_frame_sanity_check() override the wifi-lib copy (enables raw/deauth TX)
  -Wl,--allow-multiple-definition

; ---- Primary build: hardware USB-CDC (USB-Serial-JTAG). Safe/recoverable via /api/flash.
[env:newsheen-motoko]
build_flags =
  ${env.build_flags}
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

; ---- HID build: TinyUSB composite CDC + vendor HID (for WebHID "HID display").
[env:newsheen-motoko-hid]
build_flags =
  ${env.build_flags}
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D MOTOKO_HID=1
